<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agenda de Notícias</title>
<style>
body {
  font-family: Arial;
  margin: 40px;
  background: #f4f4f4;
}
.portal { margin-bottom: 30px; }
a { text-decoration: none; color: #0066cc; }
</style>
</head>

<body>

<h1>📰 Notícias do dia</h1>

<div id="conteudo">Carregando notícias...</div>

<script>
const feeds = [
  { nome: "G1", url: "https://api.rss2json.com/v1/api.json?rss_url=https://g1.globo.com/rss/g1/" },
  { nome: "UOL", url: "https://api.rss2json.com/v1/api.json?rss_url=https://rss.uol.com.br/feed/noticias.xml" },
  { nome: "CNN Brasil", url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.cnnbrasil.com.br/rss/" }
];

async function carregar() {
  let html = "";

  for (let feed of feeds) {
    const res = await fetch(feed.url);
    const data = await res.json();

    html += `<div class="portal"><h2>${feed.nome}</h2>`;

    data.items.slice(0, 10).forEach(n => {
      html += `<div><a href="${n.link}" targetiv>`;
    });

    html += "</div>";
  }

  document.getElementById("conteudo").innerHTML = html;
}

carregar();
</script>

</body>
</html>
``
