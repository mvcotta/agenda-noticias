<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agenda de Notícias</title>

<style>
body {
  font-family: Arial;
  margin: 40px;
  background: #f4f4f4;
}

h1 {
  color: #333;
}

.portal {
  margin-bottom: 30px;
}

.noticia {
  margin-bottom: 8px;
}

a {
  text-decoration: none;
  color: #0066cc;
}
</style>

</head>

<body>

<h1>📰 Notícias do dia</h1>

<div id="conteudo">Carregando...</div>

<script>
const feeds = [
  {
    nome: "G1",
    url: "https://api.rss2json.com/v1/api.json?rss_url=https://g1.globo.com/rss/g1/"
  },
  {
    nome: "UOL",
    url: "https://api.rss2json.com/v1/api.json?rss_url=https://rss.uol.com.br/feed/noticias.xml"
  },
  {
    nome: "CNN Brasil",
    url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.cnnbrasil.com.br/rss/"
  }
];

async function carregar() {
  let html = "";

  for (let feed of feeds) {
    try {
      const res = await fetch(feed.url);
      const data = await res.json();

      html += `<div class="portal"><h2>${feed.nome}</h2>`;

      if (!data.items || data.items.length === 0) {
        html += "<p>Sem notícias disponíveis</p>";
      } else {
        data.items.slice(0, 7).forEach(noticia => {
          let link = noticia.link || "#";

          // CORREÇÃO DO LINK DO G1 (às vezes vem bugado)
          if (link.includes("g1.globo.com") === false && feed.nome === "G1") {
            link = noticia.guid || link;
          }

          html += `
            <div class="noticia">
              <a href="${             ${noticia.title}
              </a>
            </div>
          `;
        });
      }

      html += "</div>";
    } catch (e) {
      html += `<div><h2>${feed.nome}</h2><p>Erro ao carregar</p></div>`;
    }
  }

  document.getElementById("conteudo").innerHTML = html;
}

carregar();
</script>

</body>
</html>
