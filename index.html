<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agenda de Notícias</title>

<style>
body {
  font-family: Arial;
  margin: 40px;
  background: #f4f4f4;
}

h1 {
  color: #333;
}

.portal {
  margin-bottom: 30px;
}

.noticia {
  margin-bottom: 8px;
}

a {
  text-decoration: none;
  color: #0066cc;
}
</style>

</head>

<body>

<h1>📰 Notícias do dia</h1>

<div id="conteudo">Carregando...</div>

<script>
const feeds = [
  { nome: "G1", url: "https://g1.globo.com/rss/g1/" },
  { nome: "UOL", url: "https://rss.uol.com.br/feed/noticias.xml" },
  { nome: "CNN Brasil", url: "https://www.cnnbrasil.com.br/rss/" }
];

async function carregar() {
  let html = "";

  for (let feed of feeds) {
    try {
      const res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(feed.url));
      const xml = await res.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(xml, "text/xml");

      const items = doc.querySelectorAll("item");

      html += `<div class="portal"><h2>${feed.nome}</h2>`;

      Array.from(items).slice(0, 10).forEach(item => {
        const titulo = item.querySelector("title")?.textContent;
        const link = item.querySelector("link")?.textContent;

        if (titulo && link) {
          html += `<div class="noticia">
            <a href="${link}" target="_blank/div>`;
        }
      });

      html += "</div>";
    } catch (e) {
      html += `<div><h2>${feed.nome}</h2><p>Erro ao carregar</p></div>`;
    }
  }

  document.getElementById("conteudo").innerHTML = html;
}

carregar();
</script>

</body>
</html>
``
